[ubuntu-dmoseley]
image=docker.io/library/ubuntu:24.04
pull=true
volume=/home/linuxbrew:/home/linuxbrew:rw
volume=/ext:/ext:ro

# ── Pre-init: clean up docker-image-specific APT config and add 3rd-party repos ──

# Remove APT overrides that are specific to pre-built Docker images
pre_init_hooks=rm -f /etc/apt/apt.conf.d/docker-gzip-indexes /etc/apt/apt.conf.d/docker-no-languages

# Add myhostname to nsswitch.conf for proper hostname resolution inside the container
pre_init_hooks=sed -Ei 's/^(hosts:.*)(\<files\>)(.*)/\1\2 myhostname \3/' /etc/nsswitch.conf

# Bootstrap tools needed for repo setup
pre_init_hooks=apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl gnupg lsb-release wget apt-transport-https

# Docker CE repo
pre_init_hooks=install -m 0755 -d /etc/apt/keyrings
pre_init_hooks=curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
pre_init_hooks=chmod a+r /etc/apt/keyrings/docker.asc
pre_init_hooks=bash -c '. /etc/os-release && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${UBUNTU_CODENAME:-$VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list'

# VS Code repo
pre_init_hooks=bash -c 'wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /etc/apt/keyrings/packages.microsoft.gpg && chmod 644 /etc/apt/keyrings/packages.microsoft.gpg'
pre_init_hooks=bash -c 'echo "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" > /etc/apt/sources.list.d/vscode.list'

# Microsoft packages repo (provides dotnet-sdk-8.0 and powershell)
pre_init_hooks=bash -c 'VER=$(grep VERSION_ID= /etc/os-release | cut -d\" -f2) && wget -qP /tmp "https://packages.microsoft.com/config/ubuntu/${VER}/packages-microsoft-prod.deb" && dpkg -i /tmp/packages-microsoft-prod.deb && rm -f /tmp/packages-microsoft-prod.deb'

pre_init_hooks=apt-get update -qq

additional_packages=ubuntu-minimal ubuntu-standard libnss-myhostname flatpak-xdg-utils
additional_packages=apt-utils apt-transport-https avahi-utils bash-completion bc bind9-dnsutils build-essential bzip2 ca-certificates chrpath cmake curl dbus-x11 dialog diffstat diffutils direnv dirmngr file findutils fish gawk git gnome-keyring gnupg gnupg2 gnupg-l10n gnupg-utils gpg gpg-agent gpgconf gpgsm gpg-wks-client gpg-wks-server hostname iproute2 iputils-ping keyutils language-pack-en less libbsd0 libcap2-bin libdrm2 libdrm-amdgpu1 libdrm-common libdrm-nouveau2 libdrm-radeon1 libedit2 libegl1 libegl-mesa0 libelf1 libexpat1 libgbm1 libgl1 libgl1-amber-dri libgl1-mesa-dri libglib2.0-bin libglvnd0 libglx0 libglx-mesa0 libkrb5-3 libksba8 libllvm15 libnpth0 libnsl2 libnss-mdns libpciaccess0 libpython3-stdlib libsensors5 libsensors-config libsqlite3-0 libtirpc3 libtirpc-common libtool libtool-bin libvte-2.91-common libvulkan1 libwayland-client0 libwayland-server0 libx11-6 libx11-data libx11-xcb1 libxau6 libxcb1 libxcb-dri2-0 libxcb-dri3-0 libxcb-glx0 libxcb-present0 libxcb-randr0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxdmcp6 libxext6 libxfixes3 libxml2 locales lsof make man-db manpages media-types mesa-vulkan-drivers mtr nano ncurses-base neofetch net-tools nmap openssh-client openssl pass passwd pigz pinentry-curses plocate procps progress python3-venv rsync software-properties-common sshpass sudo tcpdump time traceroute tree tzdata unzip util-linux wget xauth xz-utils zip zsh
additional_packages=docker-ce-cli docker-buildx-plugin docker-compose-plugin
additional_packages=dotnet-host-8.0 dotnet-hostfxr-8.0 dotnet-sdk-8.0
additional_packages=powershell
additional_packages=code

# ── Post-install hooks ──

# Moneydance personal finance app
init_hooks=curl -sLo /tmp/md.deb https://infinitekind.com/stabledl/current/moneydance_linux_amd64.deb && dpkg --install /tmp/md.deb && rm -f /tmp/md.deb
init_hooks=sed -i -e 's@#-Dsun.java2d.uiScale@-Dsun.java2d.uiScale@' /opt/Moneydance/Moneydance.vmoptions

# Starship prompt
init_hooks=curl -sS https://starship.rs/install.sh | sh -s -- -y

# Git Credential Manager v2.6.1
init_hooks=curl -sLo /tmp/gcm.deb https://github.com/git-ecosystem/git-credential-manager/releases/download/v2.6.1/gcm-linux_amd64.2.6.1.deb && dpkg -i /tmp/gcm.deb && rm -f /tmp/gcm.deb

# host-spawn v1.5.0 — run host binaries from inside the container
init_hooks=curl -sLo /usr/bin/host-spawn https://github.com/1player/host-spawn/releases/download/1.5.0/host-spawn-x86_64 && chmod +x /usr/bin/host-spawn

# xdg-open wrapper: delegates to host when running inside a container
init_hooks=printf '#!/bin/bash\nif [ ! -e /run/.containerenv ] && [ ! -e /.dockerenv ]; then\n    /usr/bin/xdg-open "$@"\nelse\n    distrobox-host-exec /usr/bin/xdg-open "$@"\nfi\n' > /usr/local/bin/xdg-open && chmod +x /usr/local/bin/xdg-open

# Preserve env vars needed for Yocto builds and Starship through sudo
init_hooks=printf 'Defaults env_keep += "CONTAINER_ID"\nDefaults env_keep += "CONTAINER_NAME"\nDefaults env_keep += "YOCTO_PROJECT"\n' > /etc/sudoers.d/containerid && chmod 600 /etc/sudoers.d/containerid

# Symlinks for host integration
init_hooks=mkdir -p /usr/share/empty
init_hooks=ln -sf /usr/libexec/flatpak-xdg-utils/flatpak-spawn /usr/bin/flatpak-spawn
init_hooks=ln -fs /usr/bin/distrobox-host-exec /usr/local/bin/flatpak
init_hooks=ln -fs /usr/bin/pinentry-curses /usr/local/bin/pinentry-drew

# Passwordless sudo (standard for distrobox containers)
init_hooks=echo "ALL ALL = (ALL) NOPASSWD: ALL" >> /etc/sudoers

# Remove Ubuntu Pro / ESM hook that causes noise in apt output
init_hooks=rm -f /etc/apt/apt.conf.d/20apt-esm-hook.conf
